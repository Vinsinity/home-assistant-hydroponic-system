[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "growasist"
version = "0.33.0.dev3"
description = "Standalone Raspberry Pi grow tracking and hardware gateway core"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "GrowAsist contributors"}]
dependencies = []

[project.scripts]
growasist = "growasist.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["growasist*", "custom_components.hydroponic_system*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.hydroponic_system" = ["data/*.json"]
"growasist.web" = ["*.html", "*.css", "*.js", "*.svg"]
