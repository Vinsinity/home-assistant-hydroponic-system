services:
  growasist:
    build: .
    container_name: growasist
    network_mode: host
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    environment:
      GROWASIST_API_TOKEN: ${GROWASIST_API_TOKEN:?Set GROWASIST_API_TOKEN in .env}
      GROWASIST_DATA_DIR: /data
    volumes:
      - ./growasist-data:/data
