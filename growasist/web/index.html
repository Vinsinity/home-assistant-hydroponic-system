<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>GrowAsist</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/app.css">
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell" data-app hidden>
      <aside class="rail">
        <a class="brand" href="#today" aria-label="GrowAsist ana sayfa">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><b>GrowAsist</b><small>Yetiştirme günlüğü</small></span>
        </a>
        <nav aria-label="Ana bölümler">
          <span class="rail-label primary-label">Yetiştirme</span>
          <button class="nav-item active" data-view="today">
            <span class="nav-icon">⌂</span><span>Genel Bakış</span>
          </button>
          <button class="nav-item" data-view="journal">
            <span class="nav-icon">▤</span><span>Günlük</span>
          </button>
          <button class="nav-item" data-view="dosing">
            <span class="nav-icon">mL</span><span>Dozaj</span>
          </button>
          <button class="nav-item mobile-setup-entry" data-view="setup">
            <span class="nav-icon">◇</span><span>Kurulum</span>
          </button>
        </nav>
        <nav class="rail-tools" aria-label="Kütüphane ve sistem bölümleri">
          <span class="rail-label">Kütüphane</span>
          <button type="button" data-setup-shortcut="plants"><span>B</span><b>Bitki kütüphanesi</b><small data-rail-count="plants"></small></button>
          <button type="button" data-setup-shortcut="nutrients"><span>N</span><b>Besinler</b><small data-rail-count="nutrients"></small></button>
          <span class="rail-label section-label">Sistem</span>
          <button type="button" data-setup-shortcut="overview"><span>A</span><b>Alan ve ışık</b><small>Yöntem ve medya</small></button>
          <button type="button" data-setup-shortcut="hardware"><span>I²C</span><b>Yerel donanım</b><small data-rail-count="hardware"></small></button>
          <button type="button" data-setup-shortcut="iot"><span>RF</span><b>IoT cihazları</b><small data-rail-count="iot"></small></button>
        </nav>
        <div class="rail-foot">
          <button class="text-button" data-lock>Oturumu kilitle</button>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <span class="page-context" data-view-kicker>Yetiştirme</span>
            <h1 data-view-title>Genel Bakış</h1>
          </div>
          <div class="system-state">
            <span class="status-dot"></span>
            <span><b>Hazır</b></span>
          </div>
        </header>
        <section class="view" data-view-content aria-live="polite"></section>
      </main>
    </div>

    <section class="auth-gate" data-auth-gate>
      <div class="auth-waterline" aria-hidden="true"><i></i></div>
      <div class="auth-panel">
        <span class="brand-mark large" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>GrowAsist'e giriş</h1>
        <p>Erişim anahtarınızı girin.</p>
        <form data-auth-form>
          <label><span>Erişim anahtarı</span><input name="token" type="password" autocomplete="current-password" required></label>
          <button class="primary-button" type="submit">Sisteme bağlan</button>
          <small class="form-message" data-auth-message></small>
        </form>
      </div>
    </section>

    <dialog class="dialog" data-dialog>
      <form method="dialog" class="dialog-shell" data-dialog-form>
        <header><div><span class="kicker" data-dialog-kicker></span><h2 data-dialog-title></h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Kapat">×</button></header>
        <div class="dialog-body" data-dialog-body></div>
        <footer data-dialog-actions></footer>
      </form>
    </dialog>

    <div class="toast" data-toast role="status" aria-live="polite"></div>
  </body>
</html>
